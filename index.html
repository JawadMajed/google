<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تنبيه أمني</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Tahoma,sans-serif}
body{
  background:#090909;color:#fff;display:grid;place-items:center;
  overflow:hidden;
}
.card{
  width:min(92vw,720px);padding:42px 28px;text-align:center;
  border:3px solid #d00;background:#111;box-shadow:0 0 40px #900;
  animation:pulse .7s infinite alternate;
}
.icon{font-size:64px;margin-bottom:10px}
h1{font-size:clamp(34px,7vw,68px);margin:0 0 18px;color:#ff3030}
p{font-size:clamp(20px,3.5vw,30px);line-height:1.6;margin:8px 0}
.small{font-size:16px!important;color:#aaa;margin-top:25px!important}
button{
  margin-top:24px;padding:14px 24px;border:0;border-radius:8px;
  background:#e00000;color:white;font-size:20px;cursor:pointer
}
@keyframes pulse{to{box-shadow:0 0 75px #f00}}
</style>
</head>
<body>
<main class="card">
  <div class="icon">⚠️</div>
  <h1>تم اختراق جهازك بنجاح!</h1>
  <p>🚨 هذا <b>محاكاة توعوية</b> ضمن دورة الأمن السيبراني.</p>
  <p>الهدف: توضيح خطورة الضغط على الروابط المشبوهة.</p>
  <button id="soundBtn">تشغيل الإنذار</button>
  <p class="small">لا يوجد اختراق حقيقي ولا يتم تثبيت أو تحميل أي شيء على جهازك.</p>
</main>

<script>
let ctx, timer;

function alarm(){
  try{
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    if(ctx.state === "suspended") ctx.resume();

    const master = ctx.createGain();
    master.gain.value = 0.22;
    master.connect(ctx.destination);

    const start = ctx.currentTime;
    for(let i=0;i<12;i++){
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type="square";
      o.frequency.setValueAtTime(i%2 ? 880 : 520, start+i*0.35);
      g.gain.setValueAtTime(0.0001,start+i*0.35);
      g.gain.exponentialRampToValueAtTime(0.7,start+i*0.35+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001,start+i*0.35+0.30);
      o.connect(g); g.connect(master);
      o.start(start+i*0.35); o.stop(start+i*0.35+0.31);
    }
  }catch(e){}
}

document.getElementById("soundBtn").addEventListener("click", alarm);

// Attempt immediately. Browsers may block sound until a user gesture.
window.addEventListener("load", ()=>setTimeout(alarm,150));
</script>
</body>
</html>
